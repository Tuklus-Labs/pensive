<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pensive activation</title>
  <style>
    :root {
      --ink: #14110f;
      --panel: #1e1a17;
      --line: #514943;
      --text: #d8d1c9;
      --muted: #8d837a;
      --ember: #ff8a24;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--ink);
      color: var(--text);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #app { position: fixed; inset: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    header {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      pointer-events: none;
    }
    h1 {
      margin: 0 0 3px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }
    #status {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      pointer-events: auto;
      appearance: none;
      border: 1px solid #6c5f55;
      color: var(--text);
      background: #211c18;
      border-radius: 6px;
      height: 30px;
      padding: 0 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--ember); color: #fff1e3; }
    button:disabled { opacity: .55; cursor: default; border-color: #4a423d; }
    #query {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      min-height: 22px;
      color: #f6dfc5;
      text-shadow: 0 0 16px rgba(255, 138, 36, .5);
      pointer-events: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #inspect {
      position: absolute;
      top: 62px;
      right: 16px;
      width: min(360px, calc(100vw - 32px));
      min-height: 86px;
      border: 1px solid #3f3731;
      background: rgba(30, 26, 23, .86);
      padding: 12px;
      color: var(--muted);
      pointer-events: none;
    }
    #inspect strong {
      display: block;
      color: var(--text);
      margin-bottom: 7px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    #inspect p { margin: 0 0 8px; color: #bdb4ab; overflow-wrap: anywhere; }
    #inspect span { color: var(--muted); }
    @media (max-width: 640px) {
      header { grid-template-columns: 1fr; }
      #inspect { top: 92px; left: 16px; right: 16px; width: auto; }
      #status { white-space: normal; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="field"></canvas>
    <header>
      <div>
        <h1>Pensive activation</h1>
        <div id="status">connecting - 0 events</div>
      </div>
      <button id="replay" type="button">Replay</button>
    </header>
    <aside id="inspect">
      <strong>idle</strong>
      <p>Move over a memory node.</p>
      <span></span>
    </aside>
    <div id="query"></div>
  </div>
  <script>
  (() => {
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const replayBtn = document.getElementById("replay");
    const queryEl = document.getElementById("query");
    const inspect = document.getElementById("inspect");
    const nodes = new Map();
    const edges = new Map();
    const pulses = [];
    let width = 1;
    let height = 1;
    let dpr = 1;
    let running = true;
    let connected = false;
    let replaying = false;
    let eventCount = 0;
    let hoverId = null;
    let mouse = {x: -9999, y: -9999};
    let source = null;
    let reconnectDelay = 700;
    let statusNote = "";
    const ember = [255, 138, 36];
    const NODE_BUDGET = 400;

    function hashId(id) {
      let h = 2166136261;
      for (let i = 0; i < id.length; i++) {
        h ^= id.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function seeded(id, salt) {
      let x = hashId(id + ":" + salt);
      x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
      return ((x >>> 0) % 100000) / 100000;
    }

    function resize() {
      dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      wake();
    }

    function glyph(kind) {
      return ({atom: "a", narrative: "n", snapshot: "s", document_chunk: "d"}[kind] || "?");
    }

    function upsertGraph(graph) {
      const now = performance.now();
      for (const raw of graph.nodes || []) {
        let n = nodes.get(raw.id);
        if (!n) {
          const r = Math.min(width, height) * 0.26;
          const a = seeded(raw.id, "a") * Math.PI * 2;
          n = {
            id: raw.id,
            x: width / 2 + Math.cos(a) * r * seeded(raw.id, "r"),
            y: height / 2 + Math.sin(a) * r * seeded(raw.id, "q"),
            vx: 0, vy: 0, heat: 0, targetHeat: 0, lastSeen: now
          };
          nodes.set(raw.id, n);
        }
        Object.assign(n, raw, {lastSeen: now});
      }
      for (const raw of graph.edges || []) {
        const key = raw.from + "|" + raw.to + "|" + raw.facet.key + "|" + raw.facet.value;
        edges.set(key, Object.assign({lastSeen: now}, raw));
      }
      evictOld();
    }

    function evictOld() {
      if (nodes.size <= NODE_BUDGET) return;
      const sorted = [...nodes.values()].sort((a, b) => (a.heat - b.heat) || (a.lastSeen - b.lastSeen));
      for (const n of sorted.slice(0, nodes.size - NODE_BUDGET)) nodes.delete(n.id);
      for (const [key, e] of edges) {
        if (!nodes.has(e.from) || !nodes.has(e.to)) edges.delete(key);
      }
    }

    async function fetchGraph(atomIds) {
      if (!atomIds || !atomIds.length) return;
      const ids = atomIds.slice(0, 30).map(encodeURIComponent).join(",");
      try {
        const res = await fetch("/viz/graph?atoms=" + ids);
        if (!res.ok) throw new Error("graph " + res.status);
        upsertGraph(await res.json());
        statusNote = "";
      } catch (err) {
        statusNote = "graph fetch failed: " + (err && err.message ? err.message : "unknown");
        setStatus();
      }
    }

    async function handleEvent(event, fromReplay) {
      eventCount++;
      setStatus();
      queryEl.textContent = event.query || "";
      await fetchGraph(event.atomIds || []);
      ignite(event.atomIds || []);
      if (fromReplay) wake();
    }

    function ignite(atomIds) {
      const now = performance.now();
      for (const id of atomIds) {
        const n = nodes.get(id);
        if (n) {
          n.heat = 1;
          n.targetHeat = 1;
          n.lastFire = now;
        }
      }
      for (const e of edges.values()) {
        if (!atomIds.includes(e.from)) continue;
        pulses.push({from: e.from, to: e.to, born: now, life: 1300, power: Math.min(.8, e.weight * 2.5)});
        const m = nodes.get(e.to);
        if (m) m.targetHeat = Math.max(m.targetHeat, Math.min(.72, e.weight * 1.6));
      }
      wake();
    }

    function connect() {
      if (source) source.close();
      source = new EventSource("/viz/events");
      source.onopen = () => {
        connected = true;
        reconnectDelay = 700;
        setStatus();
      };
      source.onmessage = (msg) => {
        try {
          const event = JSON.parse(msg.data);
          if (event.type !== "ping") handleEvent(event, false);
        } catch (_err) {}
      };
      source.onerror = () => {
        connected = false;
        setStatus();
        if (source) source.close();
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(10000, reconnectDelay * 1.6);
      };
    }

    function setStatus() {
      const mode = replaying ? "replaying" : (connected ? "connected" : "reconnecting");
      const note = statusNote ? " - " + statusNote : "";
      statusEl.textContent = mode + " - " + eventCount + " events - " + nodes.size + " nodes" + note;
      replayBtn.disabled = replaying;
    }

    async function replay() {
      replaying = true;
      setStatus();
      try {
        const res = await fetch("/viz/history?limit=40");
        if (!res.ok) throw new Error("history " + res.status);
        const payload = await res.json();
        statusNote = "";
        const rows = (payload.events || []).slice().reverse();
        for (const row of rows) {
          if (!replaying) break;
          await handleEvent({query: row.query, atomIds: [row.atom_id], sourceRef: "recall_log"}, true);
          await new Promise(resolve => setTimeout(resolve, 1500));
        }
      } catch (err) {
        statusNote = "replay failed: " + (err && err.message ? err.message : "unknown");
      } finally {
        replaying = false;
        setStatus();
      }
    }

    function physics() {
      const ns = [...nodes.values()];
      for (const n of ns) {
        n.heat += (n.targetHeat - n.heat) * 0.08;
        n.targetHeat *= 0.985;
        if (n.heat < 0.01) n.heat = 0;
      }
      for (let i = 0; i < ns.length; i++) {
        for (let j = i + 1; j < ns.length; j++) {
          const a = ns[i], b = ns[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx * dx + dy * dy + 80;
          let f = Math.min(70, 3000 / d2);
          let d = Math.sqrt(d2);
          a.vx -= dx / d * f; a.vy -= dy / d * f;
          b.vx += dx / d * f; b.vy += dy / d * f;
        }
      }
      for (const e of edges.values()) {
        const a = nodes.get(e.from), b = nodes.get(e.to);
        if (!a || !b) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        let f = (d - 110) * 0.004 * Math.max(.2, e.weight * 3);
        a.vx += dx / d * f; a.vy += dy / d * f;
        b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
      for (const n of ns) {
        n.vx += (width / 2 - n.x) * 0.0008;
        n.vy += (height / 2 - n.y) * 0.0008;
        n.vx *= 0.86; n.vy *= 0.86;
        n.x = Math.max(22, Math.min(width - 22, n.x + n.vx));
        n.y = Math.max(22, Math.min(height - 22, n.y + n.vy));
      }
    }

    function draw() {
      physics();
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#14110f";
      ctx.fillRect(0, 0, width, height);
      hoverId = null;
      for (const e of edges.values()) {
        const a = nodes.get(e.from), b = nodes.get(e.to);
        if (!a || !b) continue;
        ctx.strokeStyle = "rgba(160,150,140," + Math.min(.22, .04 + e.weight * .5) + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      const now = performance.now();
      for (let i = pulses.length - 1; i >= 0; i--) {
        const p = pulses[i];
        const a = nodes.get(p.from), b = nodes.get(p.to);
        const u = (now - p.born) / p.life;
        if (!a || !b || u >= 1) { pulses.splice(i, 1); continue; }
        const x = a.x + (b.x - a.x) * u;
        const y = a.y + (b.y - a.y) * u;
        ctx.fillStyle = "rgba(" + ember.join(",") + "," + (1 - u) * p.power + ")";
        ctx.shadowColor = "rgba(" + ember.join(",") + ",.9)";
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(x, y, 2.4 + p.power * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      for (const n of nodes.values()) {
        const hot = Math.min(1, n.heat);
        const r = 4.5 + hot * 8;
        const dx = mouse.x - n.x, dy = mouse.y - n.y;
        if (dx * dx + dy * dy < (r + 7) * (r + 7)) hoverId = n.id;
        ctx.fillStyle = hot > 0
          ? "rgba(" + ember.join(",") + "," + (.35 + hot * .65) + ")"
          : "#78706a";
        ctx.shadowColor = "rgba(" + ember.join(",") + "," + hot + ")";
        ctx.shadowBlur = hot * 28;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = hot > .45 ? "#1a120c" : "#1f1b18";
        ctx.font = "10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(glyph(n.kind), n.x, n.y + .5);
      }
      updateInspector();
      const active = pulses.length || [...nodes.values()].some(n => n.heat > .01 || Math.abs(n.vx) + Math.abs(n.vy) > .02);
      if (active) requestAnimationFrame(draw);
      else running = false;
    }

    function updateInspector() {
      const n = hoverId ? nodes.get(hoverId) : null;
      if (!n) {
        inspect.innerHTML = "<strong>idle</strong><p>Move over a memory node.</p><span></span>";
        return;
      }
      inspect.innerHTML =
        "<strong>" + escapeHtml(n.id) + " [" + escapeHtml(n.kind || "?") + "]</strong>" +
        "<p>" + escapeHtml(n.textSnippet || "") + "</p>" +
        "<span>importance " + Number(n.importance || 0).toFixed(3) + " - " + escapeHtml(n.status || "") + "</span>";
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function wake() {
      if (!running) {
        running = true;
        requestAnimationFrame(draw);
      }
    }

    window.addEventListener("resize", resize);
    canvas.addEventListener("mousemove", ev => {
      mouse = {x: ev.clientX, y: ev.clientY};
      wake();
    });
    canvas.addEventListener("mouseleave", () => {
      mouse = {x: -9999, y: -9999};
      wake();
    });
    replayBtn.addEventListener("click", replay);
    resize();
    connect();
    setStatus();
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
