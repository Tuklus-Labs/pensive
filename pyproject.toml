[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypensive"
version = "0.2.0"
description = "Spreading activation retrieval for document collections"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
full = ["sentence-transformers", "faiss-cpu", "rank-bm25"]
dev = ["pytest"]

[project.scripts]
pensive = "pensive.ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pensive"]
